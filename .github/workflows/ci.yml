name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=backend

  playwright-ui:
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests
      - name: Run UI tests
        run: npm run test:ui
        env:
          CI: true
      - name: Upload test report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: playwright-ui-report
          path: playwright-report/

  build:
    runs-on: ubuntu-latest
    needs: [playwright-ui]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install
      - name: Build frontend
        run: npm run build:frontend
      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-build
          path: frontend/out/

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1
      PIPELINE_STACK_NAME: tally-pipeline
      SOURCE_OBJECT_KEY: source.zip
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::401911313384:role/GitHubActions-TallyDeploy
          aws-region: us-east-1
      - name: Resolve pipeline stack outputs
        id: pipeline
        run: |
          ARTIFACT_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "$PIPELINE_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='ArtifactBucketName'].OutputValue" \
            --output text)
          PIPELINE_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$PIPELINE_STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='PipelineName'].OutputValue" \
            --output text)
          test -n "$ARTIFACT_BUCKET" || (echo "ArtifactBucketName output missing" && exit 1)
          test -n "$PIPELINE_NAME" || (echo "PipelineName output missing" && exit 1)
          echo "bucket=$ARTIFACT_BUCKET" >> "$GITHUB_OUTPUT"
          echo "name=$PIPELINE_NAME" >> "$GITHUB_OUTPUT"
      - name: SAM build
        working-directory: backend
        run: sam build
      - name: SAM package
        working-directory: backend
        run: |
          sam package \
            --s3-bucket "${{ steps.pipeline.outputs.bucket }}" \
            --s3-prefix lambda \
            --output-template-file ../backend-packaged.yaml \
            --region "$AWS_REGION"
      - name: Bundle source artifact
        run: |
          zip -r source.zip \
            backend-packaged.yaml \
            pipeline package.json package-lock.json \
            frontend backend tests postman \
            -x '*/node_modules/*' '*/.next/*' '*/out/*' \
               '*/.aws-sam/*' '*/playwright-report/*' '*/test-results/*'
      - name: Upload source artifact
        run: aws s3 cp source.zip "s3://${{ steps.pipeline.outputs.bucket }}/$SOURCE_OBJECT_KEY"
      - name: Start pipeline execution
        run: aws codepipeline start-pipeline-execution --name "${{ steps.pipeline.outputs.name }}"
